spring:
  datasource:
    url: jdbc:mysql://localhost:3306/uniswap_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root          # Replace with your MySQL username
    password:       # Replace with your MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # Automatically updates your database schema when you run the app
    show-sql: true          # Prints the SQL queries in your console (great for debugging!)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true    # Makes the printed SQL queries easy to read

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080                # The port your local server will run on

app:
  upload:
    dir: uploads             # Folder (relative to where the app runs) where images are saved
    base-url: http://localhost:8080/uploads   # Public URL prefix for saved images

jwt:
  # Dev-only secret. Must be at least 256 bits (32+ characters) for HS256.
  # Replace with a value from an environment variable before deploying anywhere real.
  secret: uniswap-dev-secret-key-change-this-before-deploying-anywhere-real-0000
  expiration-ms: 86400000   # 24 hours