name: uniswap

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniswap_db
      POSTGRES_USER: ${DB_USERNAME:-uniswap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uniswap-pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Host port 5433 so it doesn't clash with a locally installed PostgreSQL
    # that already owns 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-uniswap} -d uniswap_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Unset -> MailService falls back to printing codes to the backend log,
      # exactly like local dev. Set these to send real emails via Brevo/Resend.
      DB_URL: jdbc:postgresql://db:5432/uniswap_db
      DB_USERNAME: ${DB_USERNAME:-uniswap}
      DB_PASSWORD: ${DB_PASSWORD:-uniswap-pass}
      DB_DDL_AUTO: ${DB_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-deploying-anywhere-real-0000000000}
      UPLOAD_DIR: /uploads
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/uploads}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Comma-separated list of frontend origins allowed to call the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Set both to enable "Continue with Google" (see OAuth2ClientConfig).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
    volumes:
      - uploads_data:/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../uniswap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Read at runtime by next.config rewrites; targets the backend service.
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads_data:
